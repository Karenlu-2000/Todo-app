<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>今日清單</title>
  <style>
    :root { --ink:#202633; --muted:#7c8495; --line:#e8eaf0; --paper:#fff; --bg:#f7f7fb; --accent:#635bff; --danger:#d84c60; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 16px; color:var(--ink); background:radial-gradient(circle at 15% 10%,#e7e8ff 0,transparent 28rem),var(--bg); font-family:Inter,"Noto Sans TC","PingFang TC",system-ui,sans-serif; }
    main { width:min(100%,715px); background:var(--paper); border:1px solid #ececf2; border-radius:24px; padding:32px; box-shadow:0 18px 55px #35356217; }
    header { display:flex; align-items:start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0 0 6px; font-size:28px; letter-spacing:-.04em; }
    .header-right { width:210px; display:flex; flex-direction:column; gap:8px; }
    .date { color:var(--muted); font-size:14px; }
    .count { flex:none; color:var(--accent); background:#f0efff; border-radius:999px; padding:8px 11px; font-size:13px; font-weight:700; }
    form { display:flex; gap:9px; margin:8px 0 12px; }
    #categoryInput { width:132px; }
    input { width:100%; border:1px solid var(--line); background:#fafafe; border-radius:12px; padding:13px 15px; font:inherit; outline:none; transition:.2s; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 4px #635bff18; background:#fff; }
    #searchInput { width:210px; padding:9px 12px; border-radius:10px; font-size:14px; }
    #taskForm input { padding:9px 12px; }
    button { font:inherit; border:0; cursor:pointer; }
    #add { color:#fff; background:var(--accent); border-radius:12px; padding:0 17px; font-weight:700; transition:.2s; }
    #add:hover { transform:translateY(-1px); background:#554ce8; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .toolbar-right { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:9px; }
    .filters { display:flex; align-items:center; gap:5px; }
    .filter { background:transparent; color:var(--muted); padding:7px 10px; border-radius:8px; font-size:13px; }
    .filter.active { background:#f0efff; color:var(--accent); font-weight:700; }
    #clear { background:transparent; color:var(--muted); padding:7px 3px; font-size:13px; }
    #clear:hover { color:var(--danger); }
    #sortCategory, #exportCsv, #importCsv { background:#f6f6fa; color:var(--muted); padding:7px 9px; border-radius:8px; font-size:13px; }
    #sortCategory:hover, #exportCsv:hover, #importCsv:hover { color:var(--accent); background:#f0efff; }
    #importFile { display:none; }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; align-items:center; gap:12px; padding:7px 4px; border-bottom:1px solid var(--line); animation:in .22s ease-out; }
    li[draggable] { cursor:grab; }
    li.dragging { opacity:.42; }
    li.drag-over { border-top:2px solid var(--accent); }
    li:last-child { border-bottom:0; }
    .check { appearance:none; margin:0; width:21px; height:21px; border:2px solid #cfd3de; border-radius:7px; cursor:pointer; display:grid; place-content:center; }
    .check:checked { background:var(--accent); border-color:var(--accent); }
    .check:checked::after { content:"✓"; color:white; font-size:14px; font-weight:800; line-height:1; }
    .task-wrap { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
    .task-wrap:not(.editing) { cursor:text; }
    .task { flex:1; min-width:0; font-size:15px; overflow-wrap:anywhere; }
    .category { flex:none; color:#625bcf; background:#f0efff; padding:3px 7px; border-radius:6px; font-size:15px; }
    .task-wrap.editing { gap:7px; }
    .edit-category { width:115px; flex:none; }
    .edit-task { min-width:0; flex:1; }
    .drag { color:#b3b7c2; letter-spacing:-2px; font-size:17px; user-select:none; }
    .day-toggle { flex:none; color:var(--accent); background:#f0efff; border-radius:8px; padding:6px 8px; font-size:12px; font-weight:700; }
    .day-toggle:hover { background:#e5e3ff; }
    .done .task { color:var(--muted); text-decoration:line-through; }
    .delete { opacity:0; color:#a2a8b5; background:transparent; font-size:20px; padding:3px 7px; line-height:1; transition:.15s; }
    li:hover .delete, .delete:focus { opacity:1; }
    .delete:hover { color:var(--danger); }
    .empty { padding:35px 8px 25px; text-align:center; color:var(--muted); font-size:14px; }
    .section-title { border:0; padding:18px 4px 7px; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.08em; }
    .section-title:first-child { padding-top:8px; }
    .section-empty { border:0; padding:13px 4px 18px; color:#a2a8b5; font-size:13px; }
    dialog { width:min(90vw,390px); border:0; border-radius:18px; padding:22px; color:var(--ink); box-shadow:0 22px 70px #25253d35; }
    dialog::backdrop { background:#27273855; backdrop-filter:blur(2px); }
    dialog h2 { margin:0 0 8px; font-size:19px; }
    dialog p { margin:0; color:var(--muted); font-size:14px; line-height:1.6; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    .dialog-actions button { padding:9px 12px; border-radius:9px; font-size:13px; }
    #importMerge { color:#fff; background:var(--accent); }
    #importReplace { color:var(--danger); background:#fff0f2; }
    #importCancel { color:var(--muted); background:#f1f2f6; }
    .preview-wrap { max-height:230px; overflow:auto; margin-top:14px; border:1px solid var(--line); border-radius:10px; }
    .preview-table { width:100%; border-collapse:collapse; font-size:12px; }
    .preview-table th, .preview-table td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    .preview-table th { position:sticky; top:0; color:var(--muted); background:#fafafe; }
    .preview-table tr:last-child td { border-bottom:0; }
    .preview-table td:first-child { max-width:240px; overflow:hidden; text-overflow:ellipsis; }
    @keyframes in { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
    @media (max-width:480px) { main { padding:24px 19px; border-radius:20px; } header { margin-bottom:16px; flex-wrap:wrap; } .header-right, #searchInput { width:100%; } .toolbar { align-items:start; flex-wrap:wrap; gap:8px; } .filters { flex-wrap:wrap; } .toolbar-right { width:100%; justify-content:flex-end; } form { flex-wrap:wrap; } #categoryInput { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>今日清單</h1>
      <div class="header-right"><div class="date" id="date"></div><input id="searchInput" type="search" autocomplete="off" placeholder="搜尋" aria-label="搜尋未完成待辦"></div>
    </header>
    <div class="toolbar"><div class="filters"><button class="filter active" data-filter="active">未完成</button><button class="filter" data-filter="done">已完成</button><button class="filter" data-filter="all">全部</button><div class="count" id="count">0 項待辦</div></div><div class="toolbar-right"><button id="sortCategory">分類排序</button><button id="clear">清除已完成</button><button id="importCsv">匯入</button><button id="exportCsv">匯出</button><input id="importFile" type="file" accept=".csv,text/csv"></div></div>
    <form id="taskForm"><input id="taskInput" autocomplete="off" maxlength="140" placeholder="想完成什麼？" aria-label="新增待辦事項" /><input id="categoryInput" autocomplete="off" maxlength="30" placeholder="分類" aria-label="分類" /><button id="add">新增</button></form>
    <ul id="list" aria-live="polite"></ul>
  </main>
  <dialog id="importDialog"><h2>匯入待辦</h2><p id="importSummary"></p><div class="preview-wrap"><table class="preview-table"><thead><tr><th>待辦</th><th>分類</th><th>日期</th><th>狀態</th></tr></thead><tbody id="importPreview"></tbody></table></div><div class="dialog-actions"><button id="importCancel">取消</button><button id="importReplace">全部取代</button><button id="importMerge">合併匯入</button></div></dialog>
  <script>
    const storageKey = 'today-todo-v1';
    let todos = JSON.parse(localStorage.getItem(storageKey) || '[]').map(t => ({...t, when:t.when || 'today'}));
    let filter = 'active';
    let editingId = null;
    let categoryAscending = true;
    const list = document.querySelector('#list'), input = document.querySelector('#taskInput'), categoryInput = document.querySelector('#categoryInput'), searchInput = document.querySelector('#searchInput'), count = document.querySelector('#count');
    document.querySelector('#date').textContent = new Intl.DateTimeFormat('zh-TW', { month:'long', day:'numeric', weekday:'long' }).format(new Date());
    const save = () => localStorage.setItem(storageKey, JSON.stringify(todos));
    function taskHTML(t) {
      const editing = t.id === editingId;
      return `<li class="${t.done ? 'done' : ''}" ${editing ? '' : 'draggable="true"'} data-id="${t.id}"><span class="drag" title="拖曳排序">⠿</span><input class="check" type="checkbox" ${t.done ? 'checked' : ''} data-toggle="${t.id}" aria-label="完成待辦"><div class="task-wrap ${editing ? 'editing' : ''}">${editing ? `<input class="edit-category" maxlength="30" value="${escapeHTML(t.category || '')}" placeholder="分類" aria-label="編輯分類"><input class="edit-task" maxlength="140" value="${escapeHTML(t.text)}" aria-label="編輯待辦">` : `${t.category ? `<span class="category">${escapeHTML(t.category)}</span>` : ''}<div class="task">${escapeHTML(t.text)}</div>`}</div>${t.done ? '' : `<button class="day-toggle" data-day="${t.id}" title="切換今天或明天以後">${t.when === 'tomorrow' ? '明天' : '今天'}</button>`}<button class="delete" data-delete="${t.id}" aria-label="刪除待辦">×</button></li>`;
    }
    function render() {
      const shown = todos.filter(t => filter === 'all' || (filter === 'active' ? !t.done : t.done));
      const query = searchInput.value.trim().toLocaleLowerCase('zh-Hant');
      const left = todos.filter(t => !t.done).length;
      count.textContent = `${left} 項待辦`;
      if (query) {
        const results = todos.filter(t => !t.done && `${t.category || ''} ${t.text}`.toLocaleLowerCase('zh-Hant').includes(query));
        list.innerHTML = results.length ? results.map(taskHTML).join('') : '<li class="empty">找不到符合的未完成待辦</li>';
      } else if (filter === 'active') {
        const today = shown.filter(t => t.when !== 'tomorrow'), tomorrow = shown.filter(t => t.when === 'tomorrow');
        list.innerHTML = `<li class="section-title">今天</li>${today.length ? today.map(taskHTML).join('') : '<li class="section-empty">今天沒有待辦</li>'}<li class="section-title">明天以後</li>${tomorrow.length ? tomorrow.map(taskHTML).join('') : '<li class="section-empty">明天以後沒有待辦</li>'}`;
      } else {
        list.innerHTML = shown.length ? shown.map(taskHTML).join('') : `<li class="empty">${filter === 'done' ? '還沒有完成的事項' : '清單是空的，新增一件小事開始吧。'}</li>`;
      }
      if (editingId) list.querySelector('.edit-task')?.focus();
    }
    const escapeHTML = s => s.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const csvCell = value => { let text = String(value ?? ''); if (/^[=+\-@]/.test(text)) text = `'${text}`; return `"${text.replace(/"/g, '""')}"`; };
    const cleanCsvValue = value => String(value ?? '').replace(/^'(?=[=+\-@])/, '');
    function parseCSV(text) {
      const rows = [], row = []; let cell = '', quoted = false;
      text = text.replace(/^\uFEFF/, '');
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (quoted) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (char === '"') quoted = false;
          else cell += char;
        } else if (char === '"' && cell === '') quoted = true;
        else if (char === ',') { row.push(cell); cell = ''; }
        else if (char === '\n') { row.push(cell); rows.push(row.splice(0)); cell = ''; }
        else if (char !== '\r') cell += char;
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows.filter(fields => fields.some(value => value.trim() !== ''));
    }
    function exportCSV() {
      const headers = ['ID','待辦','分類','日期','狀態','排序'];
      const rows = todos.map((t, index) => [t.id, t.text, t.category || '', t.when === 'tomorrow' ? '明天以後' : '今天', t.done ? '已完成' : '未完成', index + 1]);
      const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\r\n');
      const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      const link = document.createElement('a');
      link.href = url; link.download = `待辦清單_${new Intl.DateTimeFormat('sv-SE').format(new Date())}.csv`;
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    let pendingImport = [];
    async function prepareImport(file) {
      const rows = parseCSV(await file.text());
      if (rows.length < 2) throw new Error('檔案中沒有可匯入的待辦。');
      const headers = rows[0].map(value => value.trim()), column = Object.fromEntries(headers.map((name, index) => [name, index]));
      if (column['待辦'] === undefined) throw new Error('找不到「待辦」欄位，請使用 App 匯出的 CSV 格式。');
      const usedIds = new Set(todos.map(t => String(t.id))); let nextId = Date.now();
      const parsed = rows.slice(1).map((row, index) => {
        const value = name => cleanCsvValue(row[column[name]] ?? '').trim(), text = value('待辦');
        if (!text) return null;
        const rawId = value('ID'); let id = Number(rawId);
        if (!rawId || !Number.isFinite(id)) { while (usedIds.has(String(nextId))) nextId++; id = nextId++; }
        usedIds.add(String(id));
        const date = value('日期'), status = value('狀態'), order = Number(value('排序'));
        return {todo:{id, text, category:value('分類'), when:date.includes('明天') ? 'tomorrow' : 'today', done:['已完成','完成','true','1'].includes(status.toLowerCase())}, order:Number.isFinite(order) && order > 0 ? order : index + 1};
      }).filter(Boolean);
      if (!parsed.length) throw new Error('檔案中沒有可匯入的待辦。');
      const unique = new Map(); parsed.forEach(item => unique.set(String(item.todo.id), item));
      pendingImport = [...unique.values()].sort((a, b) => a.order - b.order);
      const done = pendingImport.filter(item => item.todo.done).length;
      document.querySelector('#importSummary').textContent = `共 ${pendingImport.length} 筆：未完成 ${pendingImport.length - done} 筆、已完成 ${done} 筆。請選擇合併目前清單，或以這份檔案全部取代。`;
      document.querySelector('#importPreview').innerHTML = pendingImport.slice(0, 8).map(item => `<tr><td title="${escapeHTML(item.todo.text)}">${escapeHTML(item.todo.text)}</td><td>${escapeHTML(item.todo.category || '')}</td><td>${item.todo.when === 'tomorrow' ? '明天以後' : '今天'}</td><td>${item.todo.done ? '已完成' : '未完成'}</td></tr>`).join('');
      document.querySelector('#importDialog').showModal();
    }
    function applyImport(mode) {
      if (!pendingImport.length) return;
      if (mode === 'replace') {
        if (!confirm('確定要用匯入檔案取代目前全部待辦嗎？')) return;
        todos = pendingImport.map(item => item.todo);
      } else {
        const merged = [...todos], positions = new Map(merged.map((todo, index) => [String(todo.id), index]));
        pendingImport.forEach(item => { const key = String(item.todo.id); if (positions.has(key)) merged[positions.get(key)] = item.todo; else { positions.set(key, merged.length); merged.push(item.todo); } });
        const order = new Map(pendingImport.map(item => [String(item.todo.id), item.order]));
        const coversCurrentList = todos.every(todo => order.has(String(todo.id)));
        todos = coversCurrentList ? merged.map((todo, index) => ({todo, rank:order.get(String(todo.id)) ?? 100000 + index})).sort((a, b) => a.rank - b.rank).map(item => item.todo) : merged;
      }
      pendingImport = []; document.querySelector('#importDialog').close(); save(); render();
    }
    document.querySelector('#taskForm').addEventListener('submit', e => { e.preventDefault(); const text = input.value.trim(), category = categoryInput.value.trim(); if (!text) return; todos.push({ id:Date.now(), text, category, done:false, when:'today' }); input.value=''; categoryInput.value=''; save(); render(); input.focus(); });
    input.addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault(); if (input.value.trim()) categoryInput.focus(); });
    categoryInput.addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault(); document.querySelector('#taskForm').requestSubmit(); });
    searchInput.addEventListener('input', render);
    searchInput.addEventListener('keydown', e => { if (e.key !== 'Escape') return; searchInput.value = ''; render(); searchInput.blur(); });
    list.addEventListener('change', e => { const id = +e.target.dataset.toggle; if (!id) return; todos = todos.map(t => t.id === id ? {...t, done:e.target.checked} : t); save(); render(); });
    function commitEditing(item) {
      if (!item || +item.dataset.id !== editingId) return;
      const original = todos.find(t => t.id === editingId), text = item.querySelector('.edit-task')?.value.trim();
      if (!original) return;
      todos = todos.map(t => t.id === editingId ? {...t, text:text || original.text, category:item.querySelector('.edit-category')?.value.trim() || ''} : t);
      editingId = null; save(); render();
    }
    list.addEventListener('click', e => {
      const item = e.target.closest('li[data-id]'), id = item ? +item.dataset.id : 0;
      if (!id) return;
      if (e.target.dataset.delete) { todos = todos.filter(t => t.id !== id); editingId = null; save(); render(); return; }
      if (e.target.dataset.day) { if (editingId === id) commitEditing(item); todos = todos.map(t => t.id === id ? {...t, when:t.when === 'tomorrow' ? 'today' : 'tomorrow'} : t); editingId = null; save(); render(); return; }
      if (e.target.closest('.task-wrap') && !editingId) { editingId = id; render(); }
    });
    list.addEventListener('keydown', e => { if (!e.target.matches('.edit-task,.edit-category') || e.key !== 'Enter') return; e.preventDefault(); if (e.target.matches('.edit-category')) e.target.closest('li').querySelector('.edit-task').focus(); else commitEditing(e.target.closest('li')); });
    list.addEventListener('focusout', e => { if (!e.target.matches('.edit-task,.edit-category')) return; const item = e.target.closest('li'); setTimeout(() => { if (!item.contains(document.activeElement)) commitEditing(item); }, 0); });
    let draggedId = null;
    list.addEventListener('dragstart', e => { const item = e.target.closest('li[draggable]'); if (!item) return; draggedId = +item.dataset.id; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    list.addEventListener('dragover', e => { const item = e.target.closest('li[draggable]'); if (!item || +item.dataset.id === draggedId) return; e.preventDefault(); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); item.classList.add('drag-over'); });
    list.addEventListener('drop', e => { const item = e.target.closest('li[draggable]'); if (!item || +item.dataset.id === draggedId) return; e.preventDefault(); const from = todos.findIndex(t => t.id === draggedId), to = todos.findIndex(t => t.id === +item.dataset.id); if (from < 0 || to < 0) return; const targetWhen = todos[to].when || 'today', [moved] = todos.splice(from, 1); if (filter === 'active') moved.when = targetWhen; const insertAt = todos.findIndex(t => t.id === +item.dataset.id); todos.splice(insertAt < 0 ? todos.length : insertAt, 0, moved); save(); render(); });
    list.addEventListener('dragend', () => { draggedId = null; document.querySelectorAll('.dragging,.drag-over').forEach(el => el.classList.remove('dragging','drag-over')); });
    document.querySelector('.filters').addEventListener('click', e => { const button = e.target.closest('[data-filter]'); if (!button) return; filter = button.dataset.filter; document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b === button)); render(); });
    document.querySelector('#sortCategory').addEventListener('click', e => { todos = todos.map((todo, index) => ({todo, index})).sort((a, b) => { const ac = (a.todo.category || '').trim(), bc = (b.todo.category || '').trim(); if (!ac && !bc) return a.index - b.index; if (!ac) return 1; if (!bc) return -1; const compared = ac.localeCompare(bc, 'zh-Hant', {numeric:true, sensitivity:'base'}); return (categoryAscending ? compared : -compared) || a.index - b.index; }).map(item => item.todo); e.currentTarget.textContent = categoryAscending ? '分類 ↑' : '分類 ↓'; categoryAscending = !categoryAscending; editingId = null; save(); render(); });
    document.querySelector('#exportCsv').addEventListener('click', exportCSV);
    document.querySelector('#importCsv').addEventListener('click', () => { const picker = document.querySelector('#importFile'); picker.value = ''; picker.click(); });
    document.querySelector('#importFile').addEventListener('change', async e => { const file = e.target.files[0]; if (!file) return; try { await prepareImport(file); } catch (error) { alert(error.message || '無法讀取這份 CSV。'); } });
    document.querySelector('#importMerge').addEventListener('click', () => applyImport('merge'));
    document.querySelector('#importReplace').addEventListener('click', () => applyImport('replace'));
    document.querySelector('#importCancel').addEventListener('click', () => { pendingImport = []; document.querySelector('#importDialog').close(); });
    document.querySelector('#clear').addEventListener('click', () => { todos = todos.filter(t => !t.done); save(); render(); });
    render();
  </script>
</body>
</html>
